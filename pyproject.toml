[project]
name = "jobbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Harshank Kanungo", email = "harshank.kanungo1992@ethara.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-auth>=2.62.2",
    "gspread>=6.2.1",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "playwright>=1.49",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tenacity>=9.2.1",
]

[project.scripts]
jobbot = "jobbot:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
